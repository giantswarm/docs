name: docs-app
namespace: docs

resources:
  requests:
    cpu: 50m
    memory: 5M
    # Bounds the nginx-tmp emptyDir. It holds only the pid file and nginx's
    # temp paths -- the site itself is baked into the image.
    ephemeralStorage: 50Mi
  limits:
    cpu: 500m
    memory: 20M
    ephemeralStorage: 200Mi

# -- Target CPU architecture for this workload. Empty imposes no constraint.
# `arm64` pins the pod to arm64 nodes, adding both the `kubernetes.io/arch`
# node selector and the toleration for the `kubernetes.io/arch=arm64:NoSchedule`
# taint that Giant Swarm arm64 node pools carry. Both are required, so this
# single value sets both. Requires a multi-arch container image; an amd64-only
# image will crash-loop with `exec format error` on an arm64 node.
architecture: ""

# -- Node selector for pod scheduling. Merged with `architecture`. Pinning to
# arm64 here rather than through `architecture` also adds the arm64 taint
# toleration, so either route is safe. A value that contradicts `architecture`
# fails the render.
nodeSelector: {}

# -- Tolerations for pod scheduling. Merged with the toleration that
# `architecture: arm64` adds.
tolerations: []
