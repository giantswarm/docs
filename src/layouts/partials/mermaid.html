<script
  type="application/javascript"
  src="https://s.giantswarm.io/mermaid/12.0.0/1/mermaid.min.js"
></script>
<script>
  var config = {
    startOnLoad: false,
    theme:'{{ if site.Params.mermaid.theme }}{{ site.Params.mermaid.theme }}{{ else }}dark{{ end }}',
    align:'{{ if site.Params.mermaid.align }}{{ site.Params.mermaid.align }}{{ else }}center{{ end }}',
    themeVariables: {
      fontFamily: '{{ if site.Params.mermaid.fontFamily }}{{ site.Params.mermaid.fontFamily }}{{ else }}Roboto, Arial, sans-serif{{ end }}',
    },
  };
  mermaid.initialize(config);

  // Diagrams shrunk to fit the content column get an Expand button that
  // shows them fitted to the window, but with text no smaller than 12px, in a
  // scrollable full-window dialog. Rendering waits for load, like
  // startOnLoad: base.js re-serializes .content on DOMContentLoaded.
  window.addEventListener('load', function () {
    mermaid.run({ querySelector: '.mermaid', suppressErrors: true }).then(function () {
      var dialog = document.createElement('dialog');
      dialog.className = 'mermaid-dialog';
      dialog.setAttribute('aria-label', 'Expanded diagram');
      dialog.innerHTML = '<button class="mermaid-dialog-close" type="button">Close</button>';
      document.body.appendChild(dialog);
      dialog.querySelector('button').addEventListener('click', function () { dialog.close(); });

      var origin = null;
      dialog.addEventListener('close', function () {
        var svg = dialog.querySelector('svg');
        svg.style.cssText = origin.style;
        origin.container.insertBefore(svg, origin.button);
        origin.button.focus();
        origin = null;
        toggle();
      });

      document.addEventListener('click', function (event) {
        var button = event.target.closest('.mermaid-expand');
        if (!button) return;
        var container = button.closest('.mermaid');
        var svg = container.querySelector('svg');
        var label = svg.querySelector('.nodeLabel') || svg.querySelector('.messageText') || svg.querySelector('text');
        var minScale = label ? Math.min(1, 12 / parseFloat(getComputedStyle(label).fontSize)) : 1;
        var natural = svg.viewBox.baseVal.width;
        origin = { container: container, button: button, style: svg.style.cssText };
        svg.style.maxWidth = 'none';
        dialog.appendChild(svg);
        dialog.showModal();
        svg.style.width = Math.max(Math.min(natural, dialog.clientWidth - 48), natural * minScale) + 'px';
      });

      document.querySelectorAll('div.mermaid').forEach(function (container) {
        if (!container.querySelector('svg')) return;
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'mermaid-expand';
        button.textContent = 'Expand';
        button.setAttribute('aria-label', 'Expand diagram');
        container.appendChild(button);
      });

      function toggle() {
        if (origin) return;
        document.querySelectorAll('div.mermaid').forEach(function (container) {
          var svg = container.querySelector('svg');
          var button = container.querySelector('.mermaid-expand');
          if (!svg || !button) return;
          button.hidden = svg.getBoundingClientRect().width / svg.viewBox.baseVal.width >= 0.9;
        });
      }
      toggle();
      window.addEventListener('resize', toggle);
    });
  });
</script>
