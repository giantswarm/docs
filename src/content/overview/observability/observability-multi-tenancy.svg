<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 384" width="980" height="384">
<style>
  text { font-family: Roboto, Helvetica Neue, Arial, sans-serif; }
  .title { font-size: 30px; font-weight: 700; fill: #002645; }
  .subtitle { font-size: 15px; fill: #5b6c79; }
  .container-label { font-size: 17px; font-weight: 700; fill: #002645; text-anchor: middle; }
  .section { font-size: 12px; font-weight: 700; fill: #6f8a9f; letter-spacing: 1.5px; }
  .name { font-size: 18px; font-weight: 700; fill: #002645; }
  .desc { font-size: 13px; fill: #5b6c79; text-anchor: middle; }
  .arrow-label { font-size: 11px; font-style: italic; fill: #5b6c79; }
